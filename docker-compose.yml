services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME:-backend}
      POSTGRES_USER: ${DB_USER:-backend}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD before deploying}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-backend}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  plan-engine:
    build:
      context: ./ai/plan-engine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend

  api:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      plan-engine:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-backend}
      DB_USER: ${DB_USER:-backend}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD before deploying}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before deploying}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET before deploying}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?set ENCRYPTION_SALT before deploying}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      AIRKOREA_SERVICE_KEY: ${AIRKOREA_SERVICE_KEY:-}
      AIRKOREA_STATION_NAME: ${AIRKOREA_STATION_NAME:-}
      KMA_UV_AREA_NO: ${KMA_UV_AREA_NO:-}
      ENVIRONMENT_CONNECT_TIMEOUT_MS: ${ENVIRONMENT_CONNECT_TIMEOUT_MS:-2000}
      ENVIRONMENT_READ_TIMEOUT_MS: ${ENVIRONMENT_READ_TIMEOUT_MS:-3000}
      ODSAY_API_KEY: ${ODSAY_API_KEY:-}
      ODSAY_CONNECT_TIMEOUT_MS: ${ODSAY_CONNECT_TIMEOUT_MS:-2000}
      ODSAY_READ_TIMEOUT_MS: ${ODSAY_READ_TIMEOUT_MS:-3000}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-true}
      EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:-30}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      # SMTP_HOST: prod는 배포 환경에서 .env로 주입 (기본 빈 문자열 → fail-closed).
      # local은 smtp.gmail.com이 기본값 — 의도적 환경 차이.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_VERIFICATION_BASE_URL: ${EMAIL_VERIFICATION_BASE_URL:-http://localhost}
      CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:-v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini-2024-07-18}
      OPENAI_CONNECT_TIMEOUT_MS: ${OPENAI_CONNECT_TIMEOUT_MS:-3000}
      OPENAI_READ_TIMEOUT_MS: ${OPENAI_READ_TIMEOUT_MS:-10000}
      OPENAI_CLASSIFICATION_ENABLED: ${OPENAI_CLASSIFICATION_ENABLED:-false}
      OPENAI_CLASSIFICATION_ROLLOUT_PERCENT: ${OPENAI_CLASSIFICATION_ROLLOUT_PERCENT:-0}
      OPENAI_CLASSIFICATION_MAX_PER_SYNC: ${OPENAI_CLASSIFICATION_MAX_PER_SYNC:-5}
      OPENAI_CLASSIFICATION_MAX_CONCURRENCY: ${OPENAI_CLASSIFICATION_MAX_CONCURRENCY:-2}
      OPENAI_AI_PRIVACY_POLICY_VERSION: ${OPENAI_AI_PRIVACY_POLICY_VERSION:-}
      OPENAI_CLASSIFICATION_RETENTION_PURGE_DELAY_MS: ${OPENAI_CLASSIFICATION_RETENTION_PURGE_DELAY_MS:-300000}
      OPENAI_CLASSIFICATION_RETENTION_DELETE_CRON: ${OPENAI_CLASSIFICATION_RETENTION_DELETE_CRON:-0 30 3 * * *}
      PLAN_ENGINE_BASE_URL: ${PLAN_ENGINE_BASE_URL:-http://plan-engine:8000}
      WELLNESS_DAILY_SUMMARY_CRON: ${WELLNESS_DAILY_SUMMARY_CRON:-0 5 0 * * *}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - edge

volumes:
  pgdata:

networks:
  # 외부 ingress는 nginx와 api 사이에만 열고, DB·AI 엔진은 외부에서 도달할 수 없다.
  edge:
  backend:
    internal: true
