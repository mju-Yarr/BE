spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USER:backend}
    password: ${DB_PASSWORD:backend}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        # ponytail: 기본값 1이면 @Scheduled 작업들(캘린더 동기화, 플랜 재계산 등)이 전부 같은
        # 스레드를 공유해서 느린 작업 하나가 나머지를 지연시킴. 커밋 안 함, 로컬 확인용.
        size: 5
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
  jackson:
    # FE와 합의: camelCase (Jackson 기본값) 사용. SNAKE_CASE 설정 제거됨.
    mapper:
      # API 명세의 enum wire value는 소문자(too_early)인데 요청 DTO는 Java enum 상수(TOO_EARLY)를
      # 그대로 받는다 — actions/feedback/resolve 등 enum 필드가 있는 모든 요청 바디에 적용된다.
      accept-case-insensitive-enums: true

oauth:
  google:
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    token-url: https://oauth2.googleapis.com/token
    # ponytail: Vium용 구글 OAuth 클라이언트 ID/시크릿 미발급 — 발급 전까지 aud 검증·토큰 교환이
    # 항상 실패함(fail-closed). calendar.readonly 스코프로 새로 발급받아야 함(로그인용 client-id와
    # 같은 프로젝트여도 client-secret은 별도 발급 필요 — 로그인은 id_token 검증만 해서 안 씀).
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    calendar-events-url: https://www.googleapis.com/calendar/v3/calendars/primary/events

plan-engine:
  base-url: ${PLAN_ENGINE_BASE_URL:http://localhost:8000}

openai:
  # 일정 텍스트 분류는 기본적으로 비활성화하며, 정확한 privacy 동의와 pinned model을 함께 요구한다.
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini-2024-07-18}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:10000}
  classification:
    enabled: ${OPENAI_CLASSIFICATION_ENABLED:false}
    rollout-percent: ${OPENAI_CLASSIFICATION_ROLLOUT_PERCENT:0}
    max-per-sync: ${OPENAI_CLASSIFICATION_MAX_PER_SYNC:5}
    max-concurrency: ${OPENAI_CLASSIFICATION_MAX_CONCURRENCY:2}
    privacy-policy-version: ${OPENAI_AI_PRIVACY_POLICY_VERSION:}
    classifier-version: event-online-review-v1
    prompt-version: event-online-ko-v1
    schema-version: event-online-v1
    retention:
      purge-delay-ms: ${OPENAI_CLASSIFICATION_RETENTION_PURGE_DELAY_MS:300000}
      delete-cron: ${OPENAI_CLASSIFICATION_RETENTION_DELETE_CRON:0 30 3 * * *}

provider:
  odsay:
    # 서버 플랫폼 키는 ODSAY_API_KEY 환경변수로만 주입한다. 비어 있으면 StubRouteProvider가 사용된다.
    api-key: ${ODSAY_API_KEY:}
    route-url: https://api.odsay.com/v1/api/searchPubTransPathT
    connect-timeout-ms: ${ODSAY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ODSAY_READ_TIMEOUT_MS:3000}
  environment:
    connect-timeout-ms: ${ENVIRONMENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ENVIRONMENT_READ_TIMEOUT_MS:3000}
  kma:
    # data.go.kr decoding key. 비어 있으면 StubEnvironmentProvider가 계속 사용된다.
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    forecast-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst
    uv:
      # 생활기상지수 API의 행정구역 코드. 좌표에서 임의로 추론하지 않고 배포 환경에서 명시한다.
      area-no: ${KMA_UV_AREA_NO:}
      index-url: https://apis.data.go.kr/1360000/LivingWthrIdxServiceV5/getUVIdxV5
  airkorea:
    # AirKorea는 PM raw 값과 provider grade를 함께 준다. grade는 raw 값에서 BE가 계산하지 않는다.
    service-key: ${AIRKOREA_SERVICE_KEY:}
    station-name: ${AIRKOREA_STATION_NAME:}
    measurement-url: https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty

app:
  jwt:
    # ponytail: 로컬 개발용 기본값. 배포 시 JWT_SECRET 환경변수로 반드시 교체 (setting/security 티켓)
    secret: ${JWT_SECRET:dev-only-local-jwt-secret-must-be-at-least-64-bytes-long-for-hmac-sha512!!}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 1209600000
  encryption:
    # ponytail: 로컬 개발용 기본값. 배포 시 두 값 다 환경변수로 반드시 교체 (setting/security 티켓).
    # salt는 BytesEncryptor가 요구하는 hex 문자열 형식.
    secret: ${ENCRYPTION_SECRET:dev-only-local-encryption-secret-change-before-deploy}
    salt: ${ENCRYPTION_SALT:deadbeefdeadbeefdeadbeefdeadbeef}
  consent:
    # 필수 약관의 현재 정책 버전. 올리면 기존 동의가 만료되어 재동의를 요구한다.
    policy-version: ${CONSENT_POLICY_VERSION:v1}
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:true}
    # 제품 정책: 이메일 소유 인증 링크는 발급 후 30분간만 유효하다.
    # 변경하려면 API 계약과 FE onboarding 흐름을 함께 검토·승인해야 한다.
    token-ttl-minutes: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:30}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
    smtp:
      enabled: ${SMTP_ENABLED:false}
      from: ${SMTP_FROM:}

firebase:
  # 서비스 계정 키 경로. 설정하지 않으면 StubFcmSender가 사용됨.
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

wellness:
  daily-summary:
    # KST 00:05에 전일 DWL을 멱등 생성한다. 운영에서 필요 시 환경변수로 cron을 바꾼다.
    cron: ${WELLNESS_DAILY_SUMMARY_CRON:0 5 0 * * *}
