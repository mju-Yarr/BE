# 테스트에서 외부 SMTP 발송을 비활성화한다. main application.yaml의 datasource 등 기본 설정은 유지한다.
spring.mail.host=
app.email-verification.enabled=false
app.email-verification.base-url=http://localhost:8080

# Spring test context가 캐시별로 각자 Hikari 풀을 잡는다. 기본값 10개 × 컨텍스트 수가
# postgres max_connections(100)를 넘겨 무관한 테스트가 무더기로 "too many clients
# already"로 실패한다. 동시성 테스트가 쓰는 최대 스레드가 3이라 5면 충분하다.
spring.datasource.hikari.maximum-pool-size=5
