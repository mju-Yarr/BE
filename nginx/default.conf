limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 배포 구성: 가비아 단독 서버에 클라이언트가 직접 접속한다.
    # L7 LB/CDN을 경유하지 않으므로 $binary_remote_addr이 실제 클라이언트 IP이다.
    # 향후 LB를 도입하면 set_real_ip_from + real_ip_header를 설정해야 한다.

    # certbot 최초 발급과 갱신은 nginx를 중지하지 않는 webroot 방식으로 처리한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # FE public base URL(/v1)과 Spring root mapping을 연결한다.
    # trailing slash가 있는 proxy_pass는 /v1/ prefix를 제거한다.
    location /v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 외부 상태 점검은 Spring Actuator의 liveness/readiness 대신 단순 health로 프록시한다.
    location = /health {
        proxy_pass http://api/actuator/health;
        proxy_set_header Host $host;
    }
}
