name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify generated API spec matches controller source
        run: python3 tools/generate_api_spec.py --check

      - name: Build and test (Flyway migration runs as part of context load)
        env:
          JWT_SECRET: ci-test-jwt-secret-that-is-at-least-64-bytes-long-for-hmac-sha512-algorithm!!
          ENCRYPTION_SECRET: ci-test-encryption-secret-at-least-32-bytes
          ENCRYPTION_SALT: deadbeefdeadbeefdeadbeefdeadbeef
          EMAIL_VERIFICATION_ENABLED: false
        run: ./gradlew build
